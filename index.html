<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardezy - Sell Gift Cards</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}body{background:#050A14;color:#fff;padding:16px;padding-bottom:90px}header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}.logo{font-size:26px;font-weight:900}.logo b{color:#2D9CFF}.badge{background:#123B63;color:#7CC4FF;padding:5px 10px;border-radius:20px;font-size:11px}.sub{color:#8A9AB0;font-size:13px;margin-bottom:14px}.search{width:100%;padding:14px;border-radius:12px;border:1px solid #1E2F47;background:#0D1828;color:#fff;outline:none;margin-bottom:14px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:11px;border-radius:10px;border:1px solid #1E2F47;background:#0D1828;color:#8A9AB0;text-align:center;cursor:pointer;font-weight:bold}.tab.active{background:#2D9CFF;color:#fff;border-color:#2D9CFF}.card{background:#0D1828;border:1px solid #1E2F47;border-radius:16px;padding:16px;margin-bottom:12px}.cardTop{display:flex;justify-content:space-between;align-items:center}.cardTop b{font-size:17px}.hot{background:#1A2E1A;color:#4ADE80;padding:4px 10px;border-radius:20px;font-size:11px}.rates{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.rate{background:#050A14;border:1px solid #1E2F47;padding:8px 12px;border-radius:10px;min-width:92px}.rate small{color:#8A9AB0;font-size:11px}.rate b{color:#2D9CFF;font-size:15px;display:block;margin-top:2px}.sell{width:100%;padding:13px;background:#2D9CFF;border:none;border-radius:10px;color:#fff;font-weight:900;margin-top:12px;cursor:pointer}.sell2{background:#1E2F47;color:#fff}.adminBtn{width:auto;padding:8px 14px;background:#2D9CFF;border:none;border-radius:20px;color:#fff;font-weight:bold;cursor:pointer}.hidden{display:none}label{font-size:13px;color:#8A9AB0;display:block;margin:14px 0 6px}select,input[type=number]{width:100%;padding:14px;border-radius:10px;border:1px solid #1E2F47;background:#0D1828;color:#fff;outline:none}.save{width:100%;padding:15px;background:#2D9CFF;border:none;border-radius:10px;color:#fff;font-weight:900;margin-top:16px;cursor:pointer}.addBtn{width:100%;padding:12px;background:transparent;border:1px dashed #2D9CFF;color:#7CC4FF;border-radius:10px;margin-top:10px;cursor:pointer}.calc{background:#0D1828;border:1px solid #1E2F47;border-radius:16px;padding:16px;margin-bottom:12px}.calc h3{margin-bottom:10px}.calcRow{display:flex;gap:10px}.calcRow select,.calcRow input{flex:1}.result{background:#2D9CFF;padding:14px;border-radius:12px;text-align:center;font-weight:900;font-size:18px;margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0D1828;border-top:1px solid #1E2F47;padding:12px;text-align:center;font-size:12px;color:#8A9AB0}</style></head><body><header><div class="logo">Card<span style="color:#2D9CFF">ezy</span> 💳</div><button class="adminBtn" id="toggleBtn" onclick="toggleView()">Admin</button></header><p class="sub" id="subtitle">Sell your gift cards at the best rates • Fast payment</p><div id="customerView"><input class="search" id="search" placeholder="🔍 Search cards... Amazon, Steam, iTunes..." oninput="renderCustomer()"><div class="tabs"><div class="tab active" onclick="setFilter('all',this)">All</div><div class="tab" onclick="setFilter('popular',this)">Popular</div><div class="tab" onclick="setFilter('high',this)">High Rate</div></div><div class="calc"><h3>🧮 Rate Calculator</h3><div class="calcRow"><select id="calcCard" onchange="calc()"></select><input type="number" id="calcAmt" value="100" oninput="calc()" placeholder="Amount $"></div><div class="result" id="calcResult">₦0</div></div><div id="customerList"></div></div><div id="adminView" class="hidden"><h2>Change Rates - All Cards</h2><p style="color:#8A9AB0;font-size:13px;margin:6px 0">Select any card to edit - No more only Amazon</p><label>Select Card to Edit:</label><select id="cardSelect" onchange="renderAdmin()"></select><div id="adminRates"></div><button class="addBtn" onclick="addCountry()">+ Add New Country</button><button class="addBtn" onclick="addCard()">+ Add New Card</button><button class="save" onclick="saveRates()">Save New Rates ✅</button><button class="addBtn" onclick="resetRates()">Reset to Default</button></div><div class="bottom">Cardezy • Secure • Instant Payment • 24/7 Support</div><script>const defaultCards=[{id:1,name:"Amazon",icon:"🛒",tag:"Popular",rates:{US:1450,UK:1850,Canada:1050,Germany:1580,France:1560,Australia:950,UAE:380}},{id:2,name:"Steam",icon:"🎮",tag:"Popular",rates:{US:1350,UK:1650,Canada:1000,Euro:1450}},{id:3,name:"iTunes",icon:"🍎",tag:"Popular",rates:{US:1250,UK:1550,Canada:950}},{id:4,name:"Google Play",icon:"▶️",tag:"Popular",rates:{US:1280,UK:1580,Canada:980}},{id:5,name:"Visa",icon:"💳",tag:"High",rates:{US:1400,UK:1750}},{id:6,name:"Razer Gold",icon:"🐍",tag:"High",rates:{US:1200,UK:1500}},{id:7,name:"Walmart",icon:"🛍️",tag:"Popular",rates:{US:1300,Canada:900}},{id:8,name:"Sephora",icon:"💄",tag:"High",rates:{US:1320}},{id:9,name:"Nike",icon:"👟",tag:"High",rates:{US:1350}},{id:10,name:"eBay",icon:"🛒",tag:"Popular",rates:{US:1150,UK:1450}},{id:11,name:"Apple",icon:"🍏",tag:"High",rates:{US:1380,UK:1700}},{id:12,name:"Netflix",icon:"🎬",tag:"Popular",rates:{US:1180,UK:1450}}];let cards=JSON.parse(localStorage.getItem('cardezy_rates')||JSON.stringify(defaultCards));let isAdmin=false;let filter='all';function toggleView(){isAdmin=!isAdmin;document.getElementById('customerView').classList.toggle('hidden',isAdmin);document.getElementById('adminView').classList.toggle('hidden',!isAdmin);document.getElementById('toggleBtn').innerText=isAdmin?'Customer':'Admin';document.getElementById('subtitle').innerText=isAdmin?'Admin Dashboard - Edit all cards':'Sell your gift cards at the best rates • Fast payment';if(isAdmin)renderAdmin();else renderCustomer()}function setFilter(f,el){filter=f;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderCustomer()}function renderCustomer(){const q=(document.getElementById('search').value||'').toLowerCase();let list=cards.filter(c=>c.name.toLowerCase().includes(q));if(filter==='popular')list=list.filter(c=>c.tag==='Popular');if(filter==='high')list=list.filter(c=>c.tag==='High');document.getElementById('customerList').innerHTML=list.map(c=>`<div class="card"><div class="cardTop"><b>${c.icon} ${c.name}</b><span class="hot">Best Rate 🔥</span></div><div class="rates">${Object.entries(c.rates).map(([k,v])=>`<div class="rate"><small>${k}</small><b>₦${v.toLocaleString()}/$1</b></div>`).join('')}</div><button class="sell" onclick="alert('Sell ${c.name} - Chat us on WhatsApp to sell now!')">Sell ${c.name} Now →</button></div>`).join('')||'<p style="text-align:center;color:#8A9AB0">No card found</p>';const calcSel=document.getElementById('calcCard');if(calcSel.options.length===0){calcSel.innerHTML=cards.map(c=>`<option value="${c.name}">${c.icon} ${c.name}</option>`).join('')}calc()}function calc(){const name=document.getElementById('calcCard').value;const amt=Number(document.getElementById('calcAmt').value||0);const card=cards.find(c=>c.name===name);if(!card)return;const rate=card.rates.US||Object.values(card.rates)[0];document.getElementById('calcResult').innerText='You go get ₦'+(amt*rate).toLocaleString()}function renderAdmin(){const sel=document.getElementById('cardSelect');const curVal=sel.value||cards[0].name;sel.innerHTML=cards.map(c=>`<option value="${c.name}" ${c.name===curVal?'selected':''}>${c.icon} ${c.name}</option>`).join('');const cur=cards.find(c=>c.name===sel.value);document.getElementById('adminRates').innerHTML=Object.entries(cur.rates).map(([k,v])=>`<label>${cur.name} ${k} (₦ per $1)</label><input type="number" value="${v}" oninput="updateRate('${k}',this.value)">`).join('')}function updateRate(country,val){const sel=document.getElementById('cardSelect').value;cards=cards.map(c=>c.name===sel?{...c,rates:{...c.rates,[country]:Number(val)||0}}:c)}function addCountry(){const country=prompt('Enter country name e.g. UK, US, Euro');if(!country)return;const sel=document.getElementById('cardSelect').value;cards=cards.map(c=>c.name===sel?{...c,rates:{...c.rates,[country]:0}}:c);renderAdmin()}function addCard(){const name=prompt('Enter new card name e.g. Playstation');if(!name)return;cards.push({id:Date.now(),name:name,icon:"🎁",tag:"Popular",rates:{US:1000}});renderAdmin();alert(name+' added!')}function saveRates(){localStorage.setItem('cardezy_rates',JSON.stringify(cards));alert('Rates saved! Customer go see am now.');renderCustomer()}function resetRates(){if(!confirm('Reset all rates to default?'))return;cards=JSON.parse(JSON.stringify(defaultCards));localStorage.setItem('cardezy_rates',JSON.stringify(cards));renderAdmin();renderCustomer()}renderCustomer();</script></body></html>
